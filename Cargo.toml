[workspace]
resolver = "2"
members = [
    "crates/aura-core",
    "crates/aura-platform",
    "crates/aura-explorer",
    "crates/aura-ui",
    "crates/aura-windows",
    "crates/aura-dock",
    "crates/laminar-sys",
    "crates/aura-service",
    "crates/aura-arc",
]

[workspace.package]
version = "0.3.22"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
