# AuraArc — the AuraUI archiver.
#
# A console program that works on its own: no panel, no service, no settings file. It makes and
# reads `.zip` archives, so it can be shipped inside the bundle and handed out as a single exe.
# The Explorer talks to it by starting it, the same way a user would.
[package]
name = "aura-arc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "AuraArc: packs and unpacks .zip archives for AuraUI"
publish = false

[[bin]]
name = "AuraArc"
path = "src/main.rs"

[dependencies]
flate2 = "1"
crc32fast = "1"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
