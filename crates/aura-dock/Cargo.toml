# AuraDock — vendored from Laminar Dock 0.2.9 (MIT, Copyright (c) 2026 Dave Sousa).
# The panel, tray, stacks, previews and search are Laminar's; the Launchpad is
# reduced to one quiet panel (see docs/dock.md) and the updater is left inert,
# because AuraExplorer ships and updates itself.
[package]
name = "aura-dock"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "AuraDock: the panel and Launchpad of the AuraExplorer desktop (Rust + Windows Composition)"
publish = false

# Two programs from this package: the panel and the desktop-widget host. Everything they
# share is the library (src/lib.rs).
[[bin]]
name = "aura-dock"
path = "src/main.rs"

[[bin]]
name = "widgets"
path = "src/bin/widgets.rs"

[build-dependencies]
# Gives the panel executable its icon and version block (see build.rs).
embed-resource = "3.0"

[dependencies]
windows-numerics = "0.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
laminar-sys = { path = "../laminar-sys" }
# Same version the windows crate already uses; needed directly for #[implement] (COM objects).
windows-core = "0.62.2"

[dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_DirectX",
    "Graphics_Effects",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
