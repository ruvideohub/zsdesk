name: Dock build

# Produces the two executables of the dock edition: the file manager host and
# the dock itself. The packaging script (`scripts/package.ps1`) still creates the
# installers; this workflow only answers "did it build, and where are the exes".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/aura-dock/**'
      - 'crates/laminar-sys/**'
      - 'packaging/windows/install.*'
      - 'packaging/windows/install-readme.txt'
      - 'scripts/make-icons.py'
      - '.github/workflows/dock-build.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          path: aura
      - name: Read the ZSUI revision
        id: dependency
        shell: pwsh
        run: '"revision=$((Get-Content -LiteralPath aura/packaging/zsui-revision.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: actions/checkout@v7
        with:
          repository: qiu7824/zsui
          ref: ${{ steps.dependency.outputs.revision }}
          path: zsui
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Build the host and the dock
        working-directory: aura
        shell: pwsh
        run: |
          cargo build --locked --release -p aura-explorer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release -p aura-dock
          exit $LASTEXITCODE
      - name: Collect the executables
        working-directory: aura
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath target/release/aura-explorer.exe -Destination dist/AuraExplorer.exe
          Copy-Item -LiteralPath target/release/aura-dock.exe -Destination dist/AuraDock.exe
          # Один архив: два exe и установщик-скрипт с автозапуском рядом с ними.
          Copy-Item -LiteralPath packaging/windows/install.ps1 -Destination dist/install.ps1
          Copy-Item -LiteralPath packaging/windows/install.cmd -Destination dist/install.cmd
          Copy-Item -LiteralPath packaging/windows/install-readme.txt -Destination dist/install-readme.txt
          Get-ChildItem -LiteralPath dist | Format-Table Name, Length
      - name: Sign the executables
        working-directory: aura
        shell: pwsh
        # A self-signed certificate unless AuraExplorer_SIGN_PFX_B64 / AuraExplorer_SIGN_PFX_PASSWORD
        # hold a real one; see scripts/sign.ps1.
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/sign.ps1 -Path dist
        env:
          AuraExplorer_SIGN_PFX_B64: ${{ secrets.AuraExplorer_SIGN_PFX_B64 }}
          AuraExplorer_SIGN_PFX_PASSWORD: ${{ secrets.AuraExplorer_SIGN_PFX_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: aura-dock-windows-x64
          path: aura/dist/*
          if-no-files-found: error
