name: Dock build

# Builds the AuraUI bundle and proves it is complete.
#
# The list of what ships lives in `packaging/bundle.json` — one description for the
# workflow, the packer and the verifier. This workflow builds the packages and then
# lets `scripts/package.ps1` lay the bundle out and check it against that description,
# so CI cannot quietly ship a different set of files than a release does.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/dock-build.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          path: aura
      - name: Read the ZSUI revision
        id: dependency
        shell: pwsh
        run: '"revision=$((Get-Content -LiteralPath aura/packaging/zsui-revision.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: actions/checkout@v7
        with:
          repository: qiu7824/zsui
          ref: ${{ steps.dependency.outputs.revision }}
          path: zsui
      - uses: dtolnay/rust-toolchain@1.99.0
      # Two cheap checks that no compiler can make: every shipped program carries an icon and
      # a version block, and every string the interface shows has a translation. Both kinds of
      # defect shipped green before — a program with no icon in the Start menu, a Chinese row in the
      # fence settings — so they are checked before the long build.
      - name: Strings and icons
        shell: pwsh
        working-directory: aura
        run: |
          python scripts/check-resources.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/check-translations.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/check_slim_bundle.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/check_fences_boundary.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Fences, Dock and widgets
        working-directory: aura
        shell: pwsh
        run: |
          cargo build --locked --release -p aura-fences --bin Fences
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release -p aura-dock --bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          exit $LASTEXITCODE
      - name: Package standalone Fences
        working-directory: aura
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup not found: $iscc" }
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package-fences.ps1 -SkipBuild -BinaryPath (Join-Path (Get-Location) 'target/release/Fences.exe') -OutputDir (Join-Path (Get-Location) 'fences-release') -InnoCompiler $iscc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@(Get-ChildItem fences-release/Fences-*-x64.zip).Count -ne 1 -or @(Get-ChildItem fences-release/Fences-*-x64-setup.exe).Count -ne 1) { throw 'Standalone Fences archive or installer missing' }
      - name: Smoke-test standalone Fences installer
        working-directory: aura
        shell: pwsh
        run: |
          $setup = (Get-ChildItem fences-release/Fences-*-x64-setup.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'Fences standalone smoke'
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dir`"",'/TASKS=') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Fences setup failed: $($process.ExitCode)" }
          if (-not (Test-Path "$dir/Fences.exe")) { throw 'Installed Fences.exe is missing' }
          foreach ($name in @('AuraExplorer.exe','AuraDock.exe','AuraService.exe','widgets.exe')) {
            if (Test-Path (Join-Path $dir $name)) { throw "Standalone installer included $name" }
          }
          $uninstall = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$dir/Fences.exe")) { throw 'Fences uninstall failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: fences-standalone-windows-x64
          path: aura/fences-release/*
          if-no-files-found: error
      - name: Lay out the bundle and verify it
        working-directory: aura
        shell: pwsh
        run: |
          # Не список Copy-Item, а описание набора: раскладка, manifest.json с хешами и
          # проверка scripts/verify-bundle.ps1 — та же, что у настоящего релиза.
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -SkipBuild -TargetDir target/release -StageDir dist -NoZip
          exit $LASTEXITCODE
      - name: Sign the executables
        working-directory: aura
        shell: pwsh
        # A self-signed certificate unless AuraExplorer_SIGN_PFX_B64 / AuraExplorer_SIGN_PFX_PASSWORD
        # hold a real one; see scripts/sign.ps1.
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/sign.ps1 -Path dist
        env:
          AuraExplorer_SIGN_PFX_B64: ${{ secrets.AuraExplorer_SIGN_PFX_B64 }}
          AuraExplorer_SIGN_PFX_PASSWORD: ${{ secrets.AuraExplorer_SIGN_PFX_PASSWORD }}
      - name: Refresh the manifest after signing
        working-directory: aura
        shell: pwsh
        run: |
          # Подпись меняет байты exe, поэтому manifest.json считается заново: иначе install.ps1
          # отверг бы собственный подписанный архив, а хеши в артефакте были бы неверными.
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -ManifestOnly -StageDir dist -NoZip
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: aura-dock-windows-x64
          path: aura/dist/*
          if-no-files-found: error
      # Установщик собирается, если на образе есть Inno Setup (на windows-latest он есть);
      # без него набор всё равно годен: zip и install.ps1 — самостоятельные способы установки.
      - name: Installer (Inno Setup)
        working-directory: aura
        shell: pwsh
        run: |
          # Тот же упаковщик: он сам передаёт ISCC путь к набору, выходную папку и версию.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup is required for installer verification: $iscc"
          }
          # -ManifestOnly: набор уже разложен и подписан, его нельзя перезаписывать неподписанным.
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -ManifestOnly -StageDir dist -OutputDir installer -NoZip -InnoCompiler $iscc
          exit $LASTEXITCODE
      - name: Smoke-test independent Dock installer
        working-directory: aura
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer/AuraDock-*-x64-setup.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'AuraDock independent smoke'
          $fenceDir = Join-Path $env:RUNNER_TEMP 'Separate Fences sentinel'
          New-Item -ItemType Directory -Force -Path $fenceDir | Out-Null
          $sentinel = Join-Path $fenceDir 'Fences.exe'
          [IO.File]::WriteAllText($sentinel, 'independent')
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dir`"",'/TASKS=') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Dock setup failed: $($p.ExitCode)" }
          foreach ($name in @('AuraDock.exe','widgets.exe')) { if (-not (Test-Path (Join-Path $dir $name))) { throw "Missing $name" } }
          if (Test-Path (Join-Path $dir 'Fences.exe')) { throw 'Dock installer installed Fences' }
          $p = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path (Join-Path $dir 'AuraDock.exe'))) { throw 'Dock uninstall failed' }
          if ([IO.File]::ReadAllText($sentinel) -ne 'independent') { throw 'Dock installer modified Fences' }
      - name: Guard Fences script from removing a Dock directory
        working-directory: aura
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Dock directory sentinel'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $sentinel = Join-Path $dir 'AuraDock.exe'
          [IO.File]::WriteAllText($sentinel, 'independent')
          $script = (Resolve-Path packaging/windows/install-fences.ps1).Path
          $p = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',"`"$script`"",'-Dir',"`"$dir`"",'-Remove') -Wait -PassThru -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'fences-guard.out') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'fences-guard.err')
          if ($p.ExitCode -eq 0) { throw 'Fences removal should reject the Dock directory' }
          if ([IO.File]::ReadAllText($sentinel) -ne 'independent') { throw 'Fences script modified Dock' }
      - uses: actions/upload-artifact@v4
        with:
          name: aura-dock-setup
          path: aura/installer/*
          if-no-files-found: error
      # The tests run after the archive is uploaded, so the archive exists either way — but a
      # failing test must make the run red. Two things were wrong with the old step:
      #
      #   * it sat behind `continue-on-error`, so a red test was a green run — the archiver's
      #     "second add" test was failing for two releases and the shipped archive was corrupt;
      #   * cargo stops at the first crate whose tests fail, and that crate is the archiver, so
      #     nothing after it — core, windows, ui, service, the explorer — was ever run in CI.
      #
      # So each package is run on its own: one broken binary cannot hide the others, and the
      # summary says which ones failed. On failure the step also prints what a test binary could
      # not load, because "STATUS_ENTRYPOINT_NOT_FOUND" on its own says nothing.
      # Dock's library tests are run explicitly below; watchdog startup and timeout
      # are also exercised independently without GUI fixtures.
      - name: Fences shortcut dispatch and resolution regression tests
        shell: pwsh
        working-directory: aura
        run: |
          $dispatch = cargo test --locked --release -p aura-windows open_containing_is_explicitly_intercepted -- --list
          if ($LASTEXITCODE -ne 0 -or -not ($dispatch | Select-String -SimpleMatch 'open_containing_is_explicitly_intercepted_in_classic_and_native_dispatch')) { throw 'Shell dispatch regression test not discovered' }
          cargo test --locked --release -p aura-windows open_containing_is_explicitly_intercepted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resolution = cargo test --locked --release -p aura-fences --bin Fences shortcut_target_resolves_unicode_target -- --list
          if ($LASTEXITCODE -ne 0 -or -not ($resolution | Select-String -SimpleMatch 'shortcut_target_resolves_unicode_target_and_rejects_missing_or_non_links')) { throw 'Shortcut resolution regression test not discovered' }
          cargo test --locked --release -p aura-fences --bin Fences shortcut_target_resolves_unicode_target
          exit $LASTEXITCODE
      - name: Dock startup policy tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-dock/src/startup_policy.rs -o target/dock-startup-policy-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/dock-startup-policy-tests.exe
          exit $LASTEXITCODE
      - name: Desktop widget layer policy tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-dock/src/desktop_layer_policy.rs -o target/dock-desktop-layer-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/dock-desktop-layer-tests.exe
          exit $LASTEXITCODE
      - name: Dock watchdog protocol tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-dock/src/taskbar_guard.rs -o target/dock-watchdog-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/dock-watchdog-tests.exe
          exit $LASTEXITCODE
      - name: Dock tray and window policy tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-dock/src/tray_policy.rs -o target/dock-tray-policy-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/dock-tray-policy-tests.exe
          exit $LASTEXITCODE
      - name: Steam shortcuts and icon size policy tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-dock/src/icon_bounds.rs -o target/dock-icon-bounds-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/dock-icon-bounds-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --edition 2021 --test crates/laminar-sys/src/steam_shortcut.rs -o target/steam-shortcut-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/steam-shortcut-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fences decoration layout tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-fences/src/desktop/header_style.rs -o target/fences-header-style-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/fences-header-style-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --edition 2021 --test crates/aura-fences/src/desktop/empty_style.rs -o target/fences-empty-style-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/fences-empty-style-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --edition 2021 --test crates/aura-fences/src/desktop/scroll_style.rs -o target/fences-scroll-style-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/fences-scroll-style-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --edition 2021 --test crates/aura-fences/src/desktop/selection_style.rs -o target/fences-selection-style-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/fences-selection-style-tests.exe
          exit $LASTEXITCODE
      - name: Fences rounded corner mask tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-fences/src/desktop/rounded_mask.rs -o target/fences-rounded-mask-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/fences-rounded-mask-tests.exe
          exit $LASTEXITCODE
      - name: Fences shadow and blur policy tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-fences/src/desktop/shadow_mask.rs -o target/fences-shadow-mask-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/fences-shadow-mask-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --edition 2021 --test crates/aura-windows/src/blur_policy.rs -o target/fences-blur-policy-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/fences-blur-policy-tests.exe
          exit $LASTEXITCODE
      - name: Fences native shadow lifecycle (private desktop)
        shell: pwsh
        working-directory: aura
        run: |
          $output = cargo test --locked --release -p aura-fences --bin Fences -- --ignored --exact desktop::window_message_regression::native_fence_shadow_moves_hides_and_destroys 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { exit $code }
          if (-not ($output | Select-String -SimpleMatch '1 passed; 0 failed')) { throw 'Native shadow test did not execute' }
      - name: Desktop widget appearance policy tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-dock/src/desktop_card_policy.rs -o target/desktop-card-policy-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/desktop-card-policy-tests.exe
          exit $LASTEXITCODE
      - name: Dock appbar policy tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-dock/src/appbar_policy.rs -o target/dock-appbar-policy-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/dock-appbar-policy-tests.exe
          exit $LASTEXITCODE
      - name: Mini tray geometry tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-dock/src/tray_mini_layout.rs -o target/dock-mini-tray-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/dock-mini-tray-tests.exe
          exit $LASTEXITCODE
      - name: Compact Launchpad geometry tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-dock/src/launchpad_layout.rs -o target/dock-launchpad-layout-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/dock-launchpad-layout-tests.exe
          exit $LASTEXITCODE
      - name: Radio station navigation tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-dock/src/radio_queue.rs -o target/radio-queue-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/radio-queue-tests.exe
          exit $LASTEXITCODE
      - name: Radio callback safety tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-dock/src/radio_generation.rs -o target/radio-generation-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/radio-generation-tests.exe
          exit $LASTEXITCODE
      - name: Radio playlist parser tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-dock/src/radio_playlist.rs -o target/radio-playlist-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/radio-playlist-tests.exe
          exit $LASTEXITCODE
      - name: Launchpad category tests
        shell: pwsh
        working-directory: aura
        run: |
          rustc --edition 2021 --test crates/aura-dock/src/launchpad_categories.rs -o target/dock-launchpad-category-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/dock-launchpad-category-tests.exe
          exit $LASTEXITCODE
      - name: Dock library unit tests
        shell: pwsh
        working-directory: aura
        run: |
          # Two searches rely on real installed applications and the local Settings index;
          # run the remaining tests serially (some change the global UI language).
          $tests = cargo test --locked --release -p aura-dock --lib -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($tests | Select-String -SimpleMatch 'tray::tests::restart_clears_stale_icons_and_accepts_fresh_registration')) {
            throw 'Tray protocol test was not discovered'
          }
          if (-not ($tests | Select-String -SimpleMatch 'config::tests::launchpad_category_data_round_trips_and_old_profiles_load')) {
            throw 'Launchpad category persistence test was not discovered'
          }
          if (-not ($tests | Select-String -SimpleMatch 'tray::tests::qt_modify_then_add_with_callback_can_negotiate_v4')) {
            throw 'Tray Qt re-registration test was not discovered'
          }
          if (-not ($tests | Select-String -SimpleMatch 'tray::tests::real_posted_callbacks_use_the_negotiated_abi')) {
            throw 'Tray real callback test was not discovered'
          }
          if (-not ($tests | Select-String -SimpleMatch 'tracker::tests::focus_maps_to_closest_taskbar_window_not_always_root_owner')) {
            throw 'Tracker window test was not discovered'
          }
          if (-not ($tests | Select-String -SimpleMatch 'launchpad_input::tests::stale_replies_cannot_cross_edits_close_or_new_search')) {
            throw 'Launchpad search safety test was not discovered'
          }
          if (-not ($tests | Select-String -SimpleMatch 'launchpad::launchpad_search::tests::russian_commands_keep_their_actions_and_confirmation')) {
            throw 'Launchpad Russian command safety test was not discovered'
          }
          if (-not ($tests | Select-String -SimpleMatch 'launch_target::tests::passes_files_and_windows_uri_schemes_directly')) {
            throw 'Launch target test was not discovered'
          }
          if (-not ($tests | Select-String -SimpleMatch 'desktop_system::tests::meters_distinguish_unavailable_from_a_real_zero')) {
            throw 'Desktop system meter safety test was not discovered'
          }
          if (-not ($tests | Select-String -SimpleMatch 'desktop_retry::tests::absent_child_is_retried_after_backoff_not_forgotten')) {
            throw 'Desktop widget retry test was not discovered'
          }
          if (-not ($tests | Select-String -SimpleMatch 'tray_compact::tests::every_icon_is_reachable_and_page_is_clamped')) {
            throw 'Compact tray page test was not discovered'
          }
          if (-not ($tests | Select-String -SimpleMatch 'latest_worker::tests::slow_work_does_not_block_submit_and_only_latest_pending_is_delivered')) {
            throw 'Background worker responsiveness test was not discovered'
          }
          cargo test --locked --release -p aura-dock --lib -- --test-threads=1 --skip real_searches --skip learning_lifts_a_pick
          exit $LASTEXITCODE
      - name: Dock watchdog executable smoke test
        shell: pwsh
        working-directory: aura
        run: |
          # Test the actual GUI-subsystem executable and its stdout readiness pipe.
          # The owner is this PowerShell process; we kill the guard ourselves so
          # the smoke test never changes the runner's taskbar.
          $info = [System.Diagnostics.ProcessStartInfo]::new()
          $info.FileName = Join-Path (Get-Location) 'target/release/aura-dock.exe'
          $info.Arguments = "--watchdog $PID"
          $info.UseShellExecute = $false
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          $info.CreateNoWindow = $true
          $guard = [System.Diagnostics.Process]::new()
          $guard.StartInfo = $info
          $started = $false
          try {
            if (-not $guard.Start()) { throw 'Could not start watchdog' }
            $started = $true
            $line = $guard.StandardOutput.ReadLineAsync()
            if (-not $line.Wait(10000)) { throw 'Watchdog did not become ready in 10 seconds' }
            if ($line.Result -ne 'AURA_DOCK_WATCHDOG_READY') { throw "Unexpected watchdog response: $($line.Result)" }
            if ($guard.HasExited) { throw 'Watchdog exited after acknowledging startup' }
          } finally {
            if ($started -and -not $guard.HasExited) { $guard.Kill(); $guard.WaitForExit() }
            $guard.Dispose()
          }
      - name: Tests
        if: always()
        shell: pwsh
        working-directory: aura
        run: |
          $skip = @('aura-dock', 'laminar-sys')
          $packages = @((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            ForEach-Object { $_.name } | Where-Object { $skip -notcontains $_ })
          $failed = @()
          foreach ($package in $packages) {
            Write-Host "::group::cargo test -p $package"
            cargo test --locked --release -p $package
            if ($LASTEXITCODE -ne 0) { $failed += $package }
            Write-Host '::endgroup::'
          }
          if ($failed.Count -gt 0) {
            Write-Host ("Упали: {0}" -f ($failed -join ', ')) -ForegroundColor Red
            Write-Host 'Диагностика: что лежит рядом с тестовыми exe и что они грузят'
            Get-ChildItem target/release/*.dll -ErrorAction SilentlyContinue | ForEach-Object { "release: {0} {1}" -f $_.Name, $_.Length }
            Get-ChildItem target/release/deps/*.dll -ErrorAction SilentlyContinue | ForEach-Object { "deps: {0} {1}" -f $_.Name, $_.Length }
            Get-ChildItem "$env:SystemRoot\System32\vcruntime140*.dll", "$env:SystemRoot\System32\msvcp140*.dll" -ErrorAction SilentlyContinue |
              ForEach-Object { "{0} {1}" -f $_.Name, $_.VersionInfo.FileVersion }
            exit 1
          }
          Write-Host ("Тесты прошли: {0} пакетов" -f $packages.Count) -ForegroundColor Green
