name: Dock build

# Produces the two executables of the dock edition: the file manager host and
# the dock itself. The packaging script (`scripts/package.ps1`) still creates the
# installers; this workflow only answers "did it build, and where are the exes".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'packaging/windows/install.*'
      - 'packaging/windows/install-readme.txt'
      - 'scripts/make-icons.py'
      - '.github/workflows/dock-build.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          path: aura
      - name: Read the ZSUI revision
        id: dependency
        shell: pwsh
        run: '"revision=$((Get-Content -LiteralPath aura/packaging/zsui-revision.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: actions/checkout@v7
        with:
          repository: qiu7824/zsui
          ref: ${{ steps.dependency.outputs.revision }}
          path: zsui
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Build the host and the dock
        working-directory: aura
        shell: pwsh
        run: |
          # `--bins`: each package builds the panel/file window *and* its own component
          # (fences.exe from aura-explorer, widgets.exe from aura-dock).
          cargo build --locked --release -p aura-explorer --bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release -p aura-dock --bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The launch service: one owner for everything that starts at logon.
          cargo build --locked --release -p aura-service --bins
          exit $LASTEXITCODE
      - name: Collect the executables
        working-directory: aura
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath target/release/aura-explorer.exe -Destination dist/AuraExplorer.exe
          Copy-Item -LiteralPath target/release/aura-dock.exe -Destination dist/AuraDock.exe
          # The two components: the desktop fence host and the desktop-widget host.
          Copy-Item -LiteralPath target/release/fences.exe -Destination dist/fences.exe
          Copy-Item -LiteralPath target/release/widgets.exe -Destination dist/widgets.exe
          # The service that starts and supervises the three of them.
          Copy-Item -LiteralPath target/release/auraservice.exe -Destination dist/auraservice.exe
          # Один архив: два exe и установщик-скрипт с автозапуском рядом с ними.
          # The window hook DLL is loaded by name from the executable folder; without it the
          # Explorer takeover guard cannot start at all.
          Copy-Item -Path target/release/AuraExplorerWindowHook-*.dll -Destination dist
          Copy-Item -LiteralPath packaging/windows/install.ps1 -Destination dist/install.ps1
          Copy-Item -LiteralPath packaging/windows/install.cmd -Destination dist/install.cmd
          Copy-Item -LiteralPath packaging/windows/install-readme.txt -Destination dist/install-readme.txt
          Get-ChildItem -LiteralPath dist | Format-Table Name, Length
      - name: Sign the executables
        working-directory: aura
        shell: pwsh
        # A self-signed certificate unless AuraExplorer_SIGN_PFX_B64 / AuraExplorer_SIGN_PFX_PASSWORD
        # hold a real one; see scripts/sign.ps1.
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/sign.ps1 -Path dist
        env:
          AuraExplorer_SIGN_PFX_B64: ${{ secrets.AuraExplorer_SIGN_PFX_B64 }}
          AuraExplorer_SIGN_PFX_PASSWORD: ${{ secrets.AuraExplorer_SIGN_PFX_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: aura-dock-windows-x64
          path: aura/dist/*
          if-no-files-found: error
      # The tests used to live in a second workflow (build.yml) that had to be started by
      # hand. They run here instead, after the executables are uploaded and without
      # blocking them: a red step says "the tests broke", the archive still exists.
      - name: Tests (do not block the archive)
        if: always()
        continue-on-error: true
        working-directory: aura
        run: cargo test --locked --release --workspace --exclude aura-dock --exclude laminar-sys
      # A second edition of the explorer (no default features) has to keep compiling.
      - name: Desktop edition compiles (does not block the archive)
        if: always()
        continue-on-error: true
        working-directory: aura
        run: cargo check --locked --release -p aura-explorer --no-default-features --features desktop
