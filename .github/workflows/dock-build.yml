name: Dock build

# Builds the AuraUI bundle and proves it is complete.
#
# The list of what ships lives in `packaging/bundle.json` — one description for the
# workflow, the packer and the verifier. This workflow builds the packages and then
# lets `scripts/package.ps1` lay the bundle out and check it against that description,
# so CI cannot quietly ship a different set of files than a release does.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/dock-build.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          path: aura
      - name: Read the ZSUI revision
        id: dependency
        shell: pwsh
        run: '"revision=$((Get-Content -LiteralPath aura/packaging/zsui-revision.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: actions/checkout@v7
        with:
          repository: qiu7824/zsui
          ref: ${{ steps.dependency.outputs.revision }}
          path: zsui
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Build the host and the dock
        working-directory: aura
        shell: pwsh
        run: |
          # `--bins`: each package builds the panel/file window *and* its own component
          # (fences.exe from aura-explorer, widgets.exe from aura-dock).
          cargo build --locked --release -p aura-explorer --bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release -p aura-dock --bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The launch service: one owner for everything that starts at logon.
          cargo build --locked --release -p aura-service --bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The archiver: an exe of its own, so it ships in the bundle and alone.
          cargo build --locked --release -p aura-arc --bins
          exit $LASTEXITCODE
      - name: Lay out the bundle and verify it
        working-directory: aura
        shell: pwsh
        run: |
          # Не список Copy-Item, а описание набора: раскладка, manifest.json с хешами и
          # проверка scripts/verify-bundle.ps1 — та же, что у настоящего релиза.
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -SkipBuild -TargetDir target/release -StageDir dist -NoZip
          exit $LASTEXITCODE
      - name: Sign the executables
        working-directory: aura
        shell: pwsh
        # A self-signed certificate unless AuraExplorer_SIGN_PFX_B64 / AuraExplorer_SIGN_PFX_PASSWORD
        # hold a real one; see scripts/sign.ps1.
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/sign.ps1 -Path dist
        env:
          AuraExplorer_SIGN_PFX_B64: ${{ secrets.AuraExplorer_SIGN_PFX_B64 }}
          AuraExplorer_SIGN_PFX_PASSWORD: ${{ secrets.AuraExplorer_SIGN_PFX_PASSWORD }}
      - name: Refresh the manifest after signing
        working-directory: aura
        shell: pwsh
        run: |
          # Подпись меняет байты exe, поэтому manifest.json считается заново: иначе install.ps1
          # отверг бы собственный подписанный архив, а хеши в артефакте были бы неверными.
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -ManifestOnly -StageDir dist -NoZip
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: aura-dock-windows-x64
          path: aura/dist/*
          if-no-files-found: error
      # Установщик собирается, если на образе есть Inno Setup (на windows-latest он есть);
      # без него набор всё равно годен: zip и install.ps1 — самостоятельные способы установки.
      - name: Installer (Inno Setup)
        working-directory: aura
        shell: pwsh
        continue-on-error: true
        run: |
          # Тот же упаковщик: он сам передаёт ISCC путь к набору, выходную папку и версию.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            Write-Host "Inno Setup не найден ($iscc): пропускаю установщик, набор и install.ps1 готовы."
            exit 0
          }
          # -ManifestOnly: набор уже разложен и подписан, его нельзя перезаписывать неподписанным.
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -ManifestOnly -StageDir dist -OutputDir installer -NoZip -InnoCompiler $iscc
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: aura-ui-setup
          path: aura/installer/*
          if-no-files-found: ignore
      # The tests run after the archive is uploaded, so the archive exists either way — but a
      # failing test must make the run red. It used to be `continue-on-error`, and a failing
      # archiver test sat behind a green run for two releases: the packaged archive was
      # corrupt, and nothing said so.
      - name: Tests
        if: always()
        working-directory: aura
        run: cargo test --locked --release --workspace --exclude aura-dock --exclude laminar-sys
      # A second edition of the explorer (no default features) has to keep compiling.
      - name: Desktop edition compiles (does not block the archive)
        if: always()
        continue-on-error: true
        working-directory: aura
        run: cargo check --locked --release -p aura-explorer --no-default-features --features desktop
