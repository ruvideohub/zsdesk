name: Dock build

# Builds the AuraUI bundle and proves it is complete.
#
# The list of what ships lives in `packaging/bundle.json` — one description for the
# workflow, the packer and the verifier. This workflow builds the packages and then
# lets `scripts/package.ps1` lay the bundle out and check it against that description,
# so CI cannot quietly ship a different set of files than a release does.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/dock-build.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          path: aura
      - name: Read the ZSUI revision
        id: dependency
        shell: pwsh
        run: '"revision=$((Get-Content -LiteralPath aura/packaging/zsui-revision.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: actions/checkout@v7
        with:
          repository: qiu7824/zsui
          ref: ${{ steps.dependency.outputs.revision }}
          path: zsui
      - uses: dtolnay/rust-toolchain@1.99.0
      # Two cheap checks that no compiler can make: every shipped program carries an icon and
      # a version block, and every string the interface shows has a translation. Both kinds of
      # defect shipped green before — a blank AuraArc in the Start menu, a Chinese row in the
      # fence settings — so they are checked before the long build.
      - name: Strings and icons
        shell: pwsh
        working-directory: aura
        run: |
          python scripts/check-resources.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/check-translations.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build the host and the dock
        working-directory: aura
        shell: pwsh
        run: |
          # `--bins`: each package builds the panel/file window *and* its own component
          # (fences.exe from aura-explorer, widgets.exe from aura-dock).
          cargo build --locked --release -p aura-explorer --bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release -p aura-dock --bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The launch service: one owner for everything that starts at logon.
          cargo build --locked --release -p aura-service --bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The archiver: an exe of its own, so it ships in the bundle and alone.
          cargo build --locked --release -p aura-arc --bins
          exit $LASTEXITCODE
      - name: Lay out the bundle and verify it
        working-directory: aura
        shell: pwsh
        run: |
          # Не список Copy-Item, а описание набора: раскладка, manifest.json с хешами и
          # проверка scripts/verify-bundle.ps1 — та же, что у настоящего релиза.
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -SkipBuild -TargetDir target/release -StageDir dist -NoZip
          exit $LASTEXITCODE
      - name: Sign the executables
        working-directory: aura
        shell: pwsh
        # A self-signed certificate unless AuraExplorer_SIGN_PFX_B64 / AuraExplorer_SIGN_PFX_PASSWORD
        # hold a real one; see scripts/sign.ps1.
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/sign.ps1 -Path dist
        env:
          AuraExplorer_SIGN_PFX_B64: ${{ secrets.AuraExplorer_SIGN_PFX_B64 }}
          AuraExplorer_SIGN_PFX_PASSWORD: ${{ secrets.AuraExplorer_SIGN_PFX_PASSWORD }}
      - name: Refresh the manifest after signing
        working-directory: aura
        shell: pwsh
        run: |
          # Подпись меняет байты exe, поэтому manifest.json считается заново: иначе install.ps1
          # отверг бы собственный подписанный архив, а хеши в артефакте были бы неверными.
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -ManifestOnly -StageDir dist -NoZip
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: aura-dock-windows-x64
          path: aura/dist/*
          if-no-files-found: error
      # Установщик собирается, если на образе есть Inno Setup (на windows-latest он есть);
      # без него набор всё равно годен: zip и install.ps1 — самостоятельные способы установки.
      - name: Installer (Inno Setup)
        working-directory: aura
        shell: pwsh
        continue-on-error: true
        run: |
          # Тот же упаковщик: он сам передаёт ISCC путь к набору, выходную папку и версию.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            Write-Host "Inno Setup не найден ($iscc): пропускаю установщик, набор и install.ps1 готовы."
            exit 0
          }
          # -ManifestOnly: набор уже разложен и подписан, его нельзя перезаписывать неподписанным.
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -ManifestOnly -StageDir dist -OutputDir installer -NoZip -InnoCompiler $iscc
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: aura-ui-setup
          path: aura/installer/*
          if-no-files-found: ignore
      # The tests run after the archive is uploaded, so the archive exists either way — but a
      # failing test must make the run red. Two things were wrong with the old step:
      #
      #   * it sat behind `continue-on-error`, so a red test was a green run — the archiver's
      #     "second add" test was failing for two releases and the shipped archive was corrupt;
      #   * cargo stops at the first crate whose tests fail, and that crate is the archiver, so
      #     nothing after it — core, windows, ui, service, the explorer — was ever run in CI.
      #
      # So each package is run on its own: one broken binary cannot hide the others, and the
      # summary says which ones failed. On failure the step also prints what a test binary could
      # not load, because "STATUS_ENTRYPOINT_NOT_FOUND" on its own says nothing.
      - name: Tests
        if: always()
        shell: pwsh
        working-directory: aura
        run: |
          $skip = @('aura-dock', 'laminar-sys')
          $packages = @((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            ForEach-Object { $_.name } | Where-Object { $skip -notcontains $_ })
          $failed = @()
          foreach ($package in $packages) {
            Write-Host "::group::cargo test -p $package"
            cargo test --locked --release -p $package
            if ($LASTEXITCODE -ne 0) { $failed += $package }
            Write-Host '::endgroup::'
          }
          if ($failed.Count -gt 0) {
            Write-Host ("Упали: {0}" -f ($failed -join ', ')) -ForegroundColor Red
            Write-Host 'Диагностика: что лежит рядом с тестовыми exe и что они грузят'
            Get-ChildItem target/release/*.dll -ErrorAction SilentlyContinue | ForEach-Object { "release: {0} {1}" -f $_.Name, $_.Length }
            Get-ChildItem target/release/deps/*.dll -ErrorAction SilentlyContinue | ForEach-Object { "deps: {0} {1}" -f $_.Name, $_.Length }
            $dumpbin = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dumpbin) {
              Get-ChildItem target/release/deps/aura_explorer-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object {
                # STATUS_ENTRYPOINT_NOT_FOUND называет виновника только в диалоговом окне,
                # которого в CI нет: сверяем импорты exe с экспортами системных DLL сами.
                $text = & $dumpbin.FullName /nologo /imports $_.FullName | Out-String
                $current = $null
                $sets = @{}
                foreach ($line in ($text -split "`r?`n")) {
                  if ($line -match '^\s{4}(\S+\.dll)\s*$') {
                    $current = $matches[1]
                    if (-not $sets.ContainsKey($current)) { $sets[$current] = New-Object System.Collections.Generic.List[string] }
                    continue
                  }
                  if ($current -and $line -match '^\s+[0-9A-Fa-f]+\s+([A-Za-z_][^\s]*)\s*$') { $sets[$current].Add($matches[1]) }
                }
                foreach ($dll in $sets.Keys) {
                  # api-ms-win-* — не настоящие DLL, а схемы API set: их экспорты не перечислить.
                  if ($dll -like 'api-ms-win-*') { continue }
                  $system = Join-Path $env:SystemRoot ("System32\" + $dll)
                  if (-not (Test-Path $system)) { Write-Host "нет $dll"; continue }
                  $exports = @{}
                  (& $dumpbin.FullName /nologo /exports $system) | ForEach-Object {
                    if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') { $exports[$matches[1]] = 1 }
                  }
                  foreach ($name in $sets[$dll]) {
                    if (-not $exports.ContainsKey($name)) { Write-Host "не найдено в ${dll}: $name" -ForegroundColor Yellow }
                  }
                }
              }
            } else {
              Write-Host 'dumpbin.exe не найден'
            }
            Get-ChildItem "$env:SystemRoot\System32\vcruntime140*.dll", "$env:SystemRoot\System32\msvcp140*.dll" -ErrorAction SilentlyContinue |
              ForEach-Object { "{0} {1}" -f $_.Name, $_.VersionInfo.FileVersion }
            exit 1
          }
          Write-Host ("Тесты прошли: {0} пакетов" -f $packages.Count) -ForegroundColor Green
      # A second edition of the explorer (no default features) has to keep compiling.
      - name: Desktop edition compiles (does not block the archive)
        if: always()
        continue-on-error: true
        working-directory: aura
        run: cargo check --locked --release -p aura-explorer --no-default-features --features desktop
