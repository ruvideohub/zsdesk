name: Windows build

# Only when asked for: this run is `cargo test` over the whole workspace and it costs a
# lot of minutes, so pushes are left to the dock build (dock-build.yml), which is the run
# that actually produces the executables.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          path: aura
      - name: Read the ZSUI revision
        id: dependency
        shell: pwsh
        run: '"revision=$((Get-Content -LiteralPath aura/packaging/zsui-revision.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: actions/checkout@v7
        with:
          repository: qiu7824/zsui
          ref: ${{ steps.dependency.outputs.revision }}
          path: zsui
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Test
        working-directory: aura
        run: cargo test --workspace --exclude aura-dock --exclude laminar-sys --release --locked
      - name: Check all editions
        working-directory: aura
        shell: pwsh
        run: |
          cargo check --locked --release -p aura-explorer --no-default-features
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked --release -p aura-explorer --no-default-features --features network
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked --release -p aura-explorer --no-default-features --features desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release -p aura-explorer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked --release -p aura-explorer --no-default-features --features themed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked --release -p aura-explorer --no-default-features --features desktop-box
          exit $LASTEXITCODE
      - name: Test theme and desktop-only editions
        working-directory: aura
        shell: pwsh
        run: |
          cargo test --locked --release -p aura-explorer --no-default-features --features themed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --release -p aura-explorer --no-default-features --features desktop-box
          exit $LASTEXITCODE
